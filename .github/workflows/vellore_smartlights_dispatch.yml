name: Vellore Smart Lights Automated Dashboard Dispatch

on:
  # 1. Manual trigger from GitHub Actions tab with optional inputs
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send email report via SMTP (true/false)'
        required: true
        type: boolean
        default: true
      recipient:
        description: 'Custom recipient email (optional override)'
        required: false
        type: string
        default: ''

  # 2. Automated Scheduled Runs (Times in UTC, IST = UTC + 5:30)
  # 00:45 UTC = 06:15 AM IST (Morning Daytime Relay OFF Check)
  # 13:45 UTC = 07:15 PM IST (Evening Nighttime Relay ON Check)
  

  # 3. Webhook / External API Trigger (cURL, AppSheet, Postman)
  repository_dispatch:
    types: [vellore_dashboard_dispatch, dispatch_vellore_mail, all_dashboards_dispatch, dispatch_all_mail]

jobs:
  dispatch-vellore-dashboard:
    name: Vellore Real-Time Telemetry & Mail Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Real-Time Telemetry & Dispatch Mail
        env:
          PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL || 'https://tnsmartlights.in' }}
          VELLORE_PROJECT_ID: ${{ secrets.VELLORE_PROJECT_ID || '3' }}
          VELLORE_USERNAME: ${{ secrets.VELLORE_USERNAME || 'vcadmin' }}
          VELLORE_PASSWORD: ${{ secrets.VELLORE_PASSWORD || 'vel5555' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          VELLORE_RECIPIENTS: ${{ secrets.VELLORE_RECIPIENTS }}
        run: |
          CMD="python generate_dashboard.py --project vellore"
          
          # Check if send_email is enabled (default true on schedule/webhook)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.send_email }}" == "true" ]; then
            CMD="$CMD --send"
          fi
          
          # Check for custom recipient override (from manual workflow_dispatch or repository_dispatch client_payload)
          TARGET_RECIPIENT="${{ github.event.inputs.recipient || github.event.client_payload.recipient }}"
          if [ -n "$TARGET_RECIPIENT" ]; then
            CMD="$CMD --to '$TARGET_RECIPIENT'"
          fi
          
          echo "Executing: $CMD"
          eval $CMD

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vellore-smartlights-reports-${{ github.run_id }}
          path: |
            vellore/mail_dashboard.html
            vellore/*.xlsx
            vellore/*.csv
          retention-days: 30
